<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clarion notification stack QA</title>
    <style>
      body { padding: 32px; background: #f5f7fb; color: #243047; font: 16px/1.6 sans-serif; }
      main { max-width: 65ch; }
      h1 { font-size: 28px; }
      .qa-button { min-height: 44px; margin: 12px 12px 12px 0; padding: 8px 16px; border: 1px solid #909db0; border-radius: 8px; background: white; }
      dialog { padding: 24px; border: 1px solid #909db0; border-radius: 12px; }
      dialog::backdrop { background: #24304755; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useRef, useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import FeedbackNotice from '../src/shared/ui/FeedbackNotice.jsx';
      import { networkFailure } from '../src/shared/lib/user-errors.js';
      import '../src/styles/index.css';
      import '../src/styles/feedback.css';
      const h = React.createElement;
      function Fixture() {
        const dialog = useRef(null);
        const [load, setLoad] = useState(true);
        const [save, setSave] = useState(true);
        const [edit, setEdit] = useState(false);
        return h('main', null,
          h('h1', null, 'Notification stacking and dialog QA'),
          h('p', null, 'Prepared failures only. No account, recording, network request or save is involved.'),
          h('button', { className: 'qa-button', onClick: () => { setLoad(true); setSave(true); } }, 'Show both notifications'),
          h('button', { className: 'qa-button', onClick: () => { setEdit(true); dialog.current.showModal(); } }, 'Open edit dialog'),
          load && h(FeedbackNotice, { title: 'Meetings unavailable', onDismiss: () => setLoad(false) }, networkFailure({ operation: 'load', offline: false }).message),
          save && h(FeedbackNotice, { title: 'Saving wasn’t confirmed', onDismiss: () => setSave(false) }, networkFailure({ operation: 'save', offline: false }).message),
          h('dialog', { ref: dialog },
            h('h2', null, 'Prepared edit dialog'),
            h('p', null, 'Its notification must stay visible and dismissible above the dialog.'),
            h('button', { className: 'qa-button', onClick: () => { setEdit(false); dialog.current.close(); } }, 'Close dialog'),
            edit && h(FeedbackNotice, { title: 'Edit wasn’t confirmed', onDismiss: () => setEdit(false) }, networkFailure({ operation: 'save', offline: false }).message)));
      }
      createRoot(document.getElementById('root')).render(h(Fixture));
    </script>
  </body>
</html>

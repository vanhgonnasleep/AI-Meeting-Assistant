services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:${CLARION_BACKEND_PORT:-8002}:8002"
    environment:
      CLARION_DB_PATH: /app/data/meeting.db
      CLARION_DATA_DIR: /app/data
      CLARION_AUTH_MODE: ${CLARION_AUTH_MODE:-private}
      CLARION_PUBLIC_URL: ${CLARION_PUBLIC_URL:-http://localhost:5173}
      CLARION_FRONTEND_URL: ${CLARION_FRONTEND_URL:-http://localhost:5173}
      CLARION_ALLOWED_HOSTS: ${CLARION_ALLOWED_HOSTS:-localhost,127.0.0.1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CLARION_DATA_PATH:-./database}:/app/data
      - whisper-cache:/root/.cache/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, urllib.parse; request = urllib.request.Request('http://127.0.0.1:8002/openapi.json', headers={'Host': urllib.parse.urlsplit(os.environ['CLARION_PUBLIC_URL']).netloc}); urllib.request.urlopen(request, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:${CLARION_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  whisper-cache:

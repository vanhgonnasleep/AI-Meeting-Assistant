name: Container verification

on:
  push:
    paths:
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'docker/**'
      - 'database/**'
      - 'ai-summary-service/**'
      - 'meeting-assistant-ui/**'
      - 'scripts/container_smoke.py'
      - '.github/workflows/containers.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: clarion-container-smoke
      COMPOSE_FILE: docker-compose.yml:docker/compose.smoke.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: python scripts/container_smoke.py --state "$RUNNER_TEMP/clarion-smoke.json"
      - run: docker compose exec -T backend python /app/scripts/manage_db.py --status
      - run: docker compose restart backend
      - run: docker compose up -d --wait --wait-timeout 120
      - run: python scripts/container_smoke.py --verify --state "$RUNNER_TEMP/clarion-smoke.json"
      - run: docker compose up -d --force-recreate --wait --wait-timeout 120
        env:
          CLARION_SMOKE_AUTH_MODE: private
      - run: python scripts/container_smoke.py --private
      - name: Verify health with a strict custom host
        run: docker compose up -d --force-recreate --wait --wait-timeout 120
        env:
          CLARION_SMOKE_AUTH_MODE: private
          CLARION_PUBLIC_URL: https://meetings.example
          CLARION_FRONTEND_URL: https://meetings.example
          CLARION_ALLOWED_HOSTS: meetings.example
          CORS_ORIGINS: https://meetings.example
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes

  multiarch-build:
    # Expensive cross-compilation is available explicitly, without publishing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile.backend, Dockerfile.frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
